[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enma"
version = "1.0.0"
description = "diff two recon scans to see what changed"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Kavya Sharma"}
]

[project.scripts]
enma = "enma.cli:main"

[tool.setuptools.packages.find]
include = ["enma*"]